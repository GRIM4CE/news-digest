name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Same scan as the pre-commit hook, which can be skipped locally.
      - run: npm run leakscan -- --all
        env:
          LEAKSCAN_TERMS: ${{ secrets.LEAKSCAN_TERMS }}
